<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4"/>
      <stop offset="50%" style="stop-color:#34A853"/>
      <stop offset="100%" style="stop-color:#4285F4"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f2937" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    <!-- Scan line animation clip -->
    <clipPath id="scanClip">
      <rect x="0" y="0" width="900" height="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="12"/>
  <!-- Grid overlay -->
  <rect width="900" height="200" fill="url(#grid)" rx="12" opacity="0.4"/>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#accentGrad)" opacity="0.4" clip-path="url(#scanClip)">
    <animate attributeName="y" from="0" to="200" dur="4s" repeatCount="indefinite" easing="linear"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Decorative circuit lines left -->
  <g opacity="0.25" stroke="#4285F4" stroke-width="1" fill="none">
    <line x1="20" y1="60" x2="60" y2="60">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="60" x2="60" y2="100"/>
    <line x1="20" y1="100" x2="60" y2="100">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="60" cy="60" r="3" fill="#4285F4">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="100" r="3" fill="#34A853">
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="20" y1="140" x2="55" y2="140">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Decorative circuit lines right -->
  <g opacity="0.25" stroke="#34A853" stroke-width="1" fill="none">
    <line x1="880" y1="60" x2="840" y2="60">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="840" y1="60" x2="840" y2="110"/>
    <line x1="880" y1="110" x2="840" y2="110">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
    <circle cx="840" cy="60" r="3" fill="#34A853">
      <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="110" r="3" fill="#FBBC05">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Corner brackets -->
  <g stroke="#4285F4" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M 12 35 L 12 12 L 35 12"/>
    <path d="M 888 35 L 888 12 L 865 12"/>
    <path d="M 12 165 L 12 188 L 35 188"/>
    <path d="M 888 165 L 888 188 L 865 188"/>
  </g>

  <!-- Android robot icon (simplified) -->
  <g transform="translate(90, 65)" opacity="0.9">
    <!-- Body -->
    <rect x="0" y="20" width="40" height="30" rx="5" fill="#4285F4" opacity="0.85">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- Head -->
    <ellipse cx="20" cy="14" rx="14" ry="12" fill="#4285F4" opacity="0.85"/>
    <!-- Eyes -->
    <circle cx="13" cy="12" r="2.5" fill="white"/>
    <circle cx="27" cy="12" r="2.5" fill="white"/>
    <!-- Antenna left -->
    <line x1="10" y1="4" x2="5" y2="-3" stroke="#4285F4" stroke-width="2"/>
    <circle cx="4" cy="-4" r="1.5" fill="#34A853">
      <animate attributeName="r" values="1.5;2.5;1.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Antenna right -->
    <line x1="30" y1="4" x2="35" y2="-3" stroke="#4285F4" stroke-width="2"/>
    <circle cx="36" cy="-4" r="1.5" fill="#34A853">
      <animate attributeName="r" values="2.5;1.5;2.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Arms -->
    <rect x="-10" y="22" width="8" height="20" rx="4" fill="#4285F4" opacity="0.75"/>
    <rect x="42" y="22" width="8" height="20" rx="4" fill="#4285F4" opacity="0.75"/>
    <!-- Legs -->
    <rect x="5" y="50" width="10" height="16" rx="5" fill="#4285F4" opacity="0.75"/>
    <rect x="25" y="50" width="10" height="16" rx="5" fill="#4285F4" opacity="0.75"/>
  </g>

  <!-- Main title -->
  <text x="450" y="82" font-family="'Segoe UI', -apple-system, sans-serif" font-size="52" font-weight="800" text-anchor="middle" fill="white" filter="url(#glow)" letter-spacing="2">
    PIXEL KIT
  </text>

  <!-- Animated underline -->
  <rect x="250" y="93" width="0" height="3" rx="1.5" fill="url(#accentGrad)">
    <animate attributeName="width" from="0" to="400" dur="1.2s" fill="freeze" begin="0.3s"/>
    <animate attributeName="x" from="450" to="250" dur="1.2s" fill="freeze" begin="0.3s"/>
  </rect>

  <!-- Subtitle with typewriter effect -->
  <text x="450" y="130" font-family="'Segoe UI', monospace" font-size="15" text-anchor="middle" fill="#8b949e" letter-spacing="3">
    ANDROID TOOLKIT  ·  ADB &amp; FASTBOOT  ·  PYTHON
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" begin="0.8s"/>
  </text>

  <!-- Bottom status dots -->
  <g transform="translate(360, 162)">
    <circle cx="0" cy="0" r="4" fill="#34A853">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" font-family="monospace" font-size="11" fill="#6e7681">ADB READY</text>
    <circle cx="110" cy="0" r="4" fill="#4285F4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="122" y="4" font-family="monospace" font-size="11" fill="#6e7681">FASTBOOT</text>
  </g>
</svg>
