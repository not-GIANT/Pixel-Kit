<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2333"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="120" fill="url(#bg2)" rx="10"/>

  <!-- Card 1: ADB -->
  <g transform="translate(10, 10)">
    <rect width="200" height="100" rx="8" fill="url(#card1)" stroke="#4285F4" stroke-width="1" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="30" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle" fill="#4285F4" filter="url(#glow2)">📱</text>
    <text x="100" y="55" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">ADB Operations</text>
    <text x="100" y="72" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#8b949e">Push · Pull · Install · Mirror</text>
    <text x="100" y="88" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#8b949e">Reboot · Sideload · Diag</text>
  </g>

  <!-- Card 2: Fastboot -->
  <g transform="translate(222, 10)">
    <rect width="200" height="100" rx="8" fill="url(#card1)" stroke="#FBBC05" stroke-width="1" opacity="0.9">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="30" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle" fill="#FBBC05" filter="url(#glow2)">⚡</text>
    <text x="100" y="55" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">Fastboot Control</text>
    <text x="100" y="72" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#8b949e">Lock · Unlock · Slots · Wipe</text>
    <text x="100" y="88" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#8b949e">Live Boot · Device Info</text>
  </g>

  <!-- Card 3: Flash -->
  <g transform="translate(434, 10)">
    <rect width="200" height="100" rx="8" fill="url(#card1)" stroke="#EA4335" stroke-width="1" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="30" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle" fill="#EA4335" filter="url(#glow2)">🛠️</text>
    <text x="100" y="55" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">Partition Flasher</text>
    <text x="100" y="72" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#8b949e">30+ Partitions · Boot · Vbmeta</text>
    <text x="100" y="88" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#8b949e">Recovery · System · Vendor</text>
  </g>

  <!-- Card 4: CPID IMEI Repair -->
  <g transform="translate(646, 10)">
    <rect width="200" height="100" rx="8" fill="url(#card1)" stroke="#34A853" stroke-width="1" opacity="0.9">
      <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="100" y="30" font-family="'Segoe UI', sans-serif" font-size="24" text-anchor="middle" fill="#34A853" filter="url(#glow2)">🔑</text>
    <text x="100" y="55" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="white">CPID IMEI Repair</text>
    <text x="100" y="72" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#8b949e">EFS Reset · Diag Mode · Root</text>
    <text x="100" y="88" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#8b949e">Qualcomm · Pixel 6–10</text>
  </g>
</svg>
